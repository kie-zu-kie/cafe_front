<section id="customers" class="page-section">
            <div class="section-header">
              <div>
                <p class="eyebrow">RELATIONSHIPS</p>
                <h2>Customers</h2>
                <p class="muted">
                  Build loyalty one delicious order at a time.
                </p>
              </div>
              <button class="primary-btn" id="add-customer-btn" type="button">
                ＋ Add customer
              </button>
            </div>
            <div class="stats-grid customer-stats">
              <article class="stat-card">
                <span>Total customers</span
                ><strong id="customer-count">0</strong
                ><small class="positive">From your database</small>
              </article>
              <article class="stat-card">
                <span>Returning customers</span><strong>0%</strong
                ><small class="positive">From your database</small>
              </article>
              <article class="stat-card">
                <span>Rewards points issued</span><strong>0</strong
                ><small class="muted">Across all customers</small>
              </article>
            </div>
            <div class="panel table-panel">
              <div class="table-wrap">
                <table>
                  <caption class="sr-only">Customer contact and order history</caption>
                  <thead>
                    <tr>
                      <th scope="col">CUSTOMER</th>
                      <th scope="col">CONTACT</th>
                      <th scope="col">ORDERS</th>
                      <th scope="col">LIFETIME VALUE</th>
                      <th scope="col">LAST ORDER</th>
                    </tr>
                  </thead>
                  <tbody id="customers-table"></tbody>
                </table>
              </div>
            </div>
          </section>
