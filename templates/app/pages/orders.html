<section id="orders" class="page-section">
            <div class="section-header">
              <div>
                <p class="eyebrow">SALES & FULFILLMENT</p>
                <h2>Orders</h2>
    
              </div>
              <button class="primary-btn create-order-action" id="new-order-btn-2">
                ＋ New order
              </button>
            </div>
            <div class="filter-bar">
              <label class="search-input">
                <span aria-hidden="true">⌕</span>
                <input
                  id="order-search"
                  type="search"
                  aria-label="Search orders or customers"
                  type="search"
                  aria-label="Search orders or customers"
                  placeholder="Search orders or customers"
                />
              </label>
              <button
                class="filter-btn order-filter active"
                data-status="all"
                type="button"
              >
                All orders</button
              ><button
                class="filter-btn order-filter"
                data-status="Today"
                type="button"
              >
                Today
              </button>
            </div>
            <div class="panel table-panel">
              <div class="table-wrap">
                <table>
                  <caption class="sr-only">Orders, customer, items, totals, and status</caption>
                  <thead>
                    <tr>
                      <th scope="col">ORDER</th>
                      <th scope="col">CUSTOMER</th>
                      <th scope="col">ITEMS</th>
                      <th scope="col">DATE</th>
                      <th scope="col">TOTAL</th>
                      <th scope="col">STATUS</th>
                    </tr>
                  </thead>
                  <tbody id="orders-table"></tbody>
                </table>
              </div>
            </div>
          </section>
